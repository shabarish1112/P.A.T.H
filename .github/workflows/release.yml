name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions: {contents: read}
  images:
    needs: quality
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    env:
      TRIVY_IMAGE: aquasec/trivy:latest@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build, scan and generate SBOMs before any registry push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sbom
          for service in backend frontend; do
            docker build -t path-$service:release $service
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --exit-code 1 path-$service:release
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" "$TRIVY_IMAGE" image --format cyclonedx --output /out/$service.cdx.json path-$service:release
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sboms
          path: sbom/*.cdx.json
          retention-days: 90
      - name: Publish only after CI and image scans passed
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for service in backend frontend; do
            target="ghcr.io/$owner/path-$service:$GITHUB_REF_NAME"
            docker tag path-$service:release "$target"
            docker push "$target"
          done
