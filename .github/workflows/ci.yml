name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.2.1
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: ci-root-password
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet -u root -p ci-root-password --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ENVIRONMENT: test
      MONGO_URI: mongodb://root:ci-root-password@localhost:27017/path?authSource=admin
      MONGO_DB: path
      JWT_SECRET: ci-only-64-character-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CORS_ORIGINS: http://localhost:5173
      DOCS_ENABLED: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && ruff check . && ruff format --check .
      - run: cd backend && mypy app
      - run: cd backend && pytest
      - run: cd backend && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run format:check
      - run: cd frontend && npm test
      - run: cd frontend && npm run build
      - run: cd frontend && npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install detect-secrets==1.5.0
      - run: detect-secrets scan --baseline .secrets.baseline

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Generate ephemeral E2E credentials
        shell: bash
        run: |
          echo "E2E_MONGO_ROOT_USER=root" >> "$GITHUB_ENV"
          echo "E2E_MONGO_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "E2E_PATH_APP_USER=path_test" >> "$GITHUB_ENV"
          echo "E2E_PATH_APP_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "E2E_JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "E2E_EMAIL=e2e-admin@example.invalid" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$(openssl rand -base64 30 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: docker compose -f docker-compose.test.yml up -d --build
      - name: Create E2E admin
        shell: bash
        run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health/ready && break || sleep 2; done
          printf '%s\n' "$E2E_PASSWORD" | docker compose -f docker-compose.test.yml exec -T backend python scripts/create_user.py --email "$E2E_EMAIL" --role admin --password-stdin
      - run: cd frontend && npm run e2e
        env:
          E2E_EMAIL: ${{ env.E2E_EMAIL }}
          E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
      - if: always()
        run: docker compose -f docker-compose.test.yml logs

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t path-backend:ci backend
      - run: docker build -t path-frontend:ci frontend
