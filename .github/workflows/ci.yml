name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install --require-hashes -r backend/requirements-dev.lock
      - run: cd backend && ruff check . && ruff format --check . && mypy app && pytest
      - run: pip-audit -r backend/requirements.lock
      - run: pip-licenses --format=json --with-urls --output-file=docs/licenses/python.json
      - run: python scripts/check_licenses.py
  frontend:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run lint && npm run format:check && npm test && npm run build && npm audit --audit-level=high
      - run: cd frontend && npx license-checker --json > ../docs/licenses/npm.json
      - run: python scripts/check_licenses.py
  secret-scan:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.14'}
      - run: pip install detect-secrets==1.5.0
      - run: python scripts/verify_secret_scan.py
      - run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
  e2e:
    env: {DOMAIN: path.example.com}
    runs-on: ubuntu-latest
    needs: [backend, frontend, secret-scan]
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: python scripts/ci_env.py
      - run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker compose -f docker-compose.test.yml up -d --build
      - name: Provision first administrator without logging credentials
        shell: python
        run: |
          import os, subprocess, time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
                  break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit('Backend did not become ready')
          subprocess.run(['docker', 'compose', '-f', 'docker-compose.test.yml', 'exec', '-T', 'backend', 'python', 'scripts/create_user.py', '--email', os.environ['E2E_EMAIL'], '--role', 'admin', '--password-stdin'], input=os.environ['E2E_PASSWORD']+'\n', text=True, check=True)
      - run: python scripts/smoke.py
      - name: Verify Mongo audit permissions
        run: docker compose -f docker-compose.test.yml exec -T mongo mongosh --quiet path < infra/verify-audit-role.js
      - run: cd frontend && npm run e2e
      - if: always()
        run: docker compose -f docker-compose.test.yml down
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend, secret-scan]
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build -t path-backend:ci backend
      - run: docker build -t path-frontend:ci frontend
