services:
  mongo:
    image: mongo:8.2.1@sha256:e64a984d36b24419327c558b49a9100cf78191706222da6a7c8cf56a743ad3db
    environment:
      MONGO_INITDB_DATABASE: path
    volumes:
    - ./infra/mongo-init:/docker-entrypoint-initdb.d:ro
    env_file:
    - path: infra/mongo.env
      required: false
    entrypoint:
    - /bin/sh
    - -ec
    - ': "$${MONGO_ROOT_USER:?Mongo root user required}" "$${MONGO_ROOT_PASSWORD:?Mongo
      root password required}" "$${PATH_APP_USER:?App user required}" "$${PATH_APP_PASSWORD:?App
      password required}"; export MONGO_INITDB_ROOT_USERNAME="$$MONGO_ROOT_USER" MONGO_INITDB_ROOT_PASSWORD="$$MONGO_ROOT_PASSWORD";
      exec docker-entrypoint.sh "$$@"'
    - --
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --host
      - mongo
      - path
      - --eval
      - if (!db.auth(process.env.PATH_APP_USER, process.env.PATH_APP_PASSWORD)) quit(1);
        db.audit_logs.findOne({});
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  backend:
    build: ./backend
    environment:
      ENVIRONMENT: test
    depends_on:
      mongo:
        condition: service_healthy
    ports:
    - 8000:8000
    env_file:
    - path: ${BACKEND_ENV_FILE:-backend/.env}
      required: false
  frontend:
    build: ./frontend
    depends_on:
    - backend
    ports:
    - 5173:8080
