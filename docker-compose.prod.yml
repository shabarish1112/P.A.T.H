services:
  mongo:
    image: mongo:8.2.1@sha256:e64a984d36b24419327c558b49a9100cf78191706222da6a7c8cf56a743ad3db
    restart: unless-stopped
    command:
    - mongod
    - --auth
    - --tlsMode
    - requireTLS
    - --tlsCertificateKeyFile
    - /run/tls/mongo.pem
    - --tlsCAFile
    - /run/tls/ca.pem
    environment:
      MONGO_INITDB_DATABASE: path
    volumes:
    - mongo-prod:/data/db
    - ./infra/mongo-init:/docker-entrypoint-initdb.d:ro
    - ./secrets/tls:/run/tls:ro
    networks:
    - private
    env_file:
    - path: infra/mongo.env
      required: false
    entrypoint:
    - /bin/sh
    - -ec
    - ': "$${MONGO_ROOT_USER:?Mongo root user required}" "$${MONGO_ROOT_PASSWORD:?Mongo
      root password required}" "$${PATH_APP_USER:?App user required}" "$${PATH_APP_PASSWORD:?App
      password required}"; export MONGO_INITDB_ROOT_USERNAME="$$MONGO_ROOT_USER" MONGO_INITDB_ROOT_PASSWORD="$$MONGO_ROOT_PASSWORD";
      exec docker-entrypoint.sh "$$@"'
    - --
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --host
      - mongo
      - --tls
      - --tlsCAFile
      - /run/tls/ca.pem
      - --tlsCertificateKeyFile
      - /run/tls/app.pem
      - path
      - --eval
      - if (!db.auth(process.env.PATH_APP_USER, process.env.PATH_APP_PASSWORD)) quit(1);
        db.audit_logs.findOne({});
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  redis:
    image: redis:8.2.2-alpine@sha256:59b6e694653476de2c992937ebe1c64182af4728e54bb49e9b7a6c26614d8933
    command:
    - /bin/sh
    - -ec
    - ': "$${REDIS_PASSWORD:?Redis password required}"; exec redis-server --appendonly
      yes --requirepass "$$REDIS_PASSWORD"'
    restart: unless-stopped
    networks:
    - private
    env_file:
    - path: infra/redis.env
      required: false
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
    - path: ${BACKEND_ENV_FILE:-backend/.env}
      required: false
    environment:
      ENVIRONMENT: production
      DOCS_ENABLED: 'false'
      CACHE_BACKEND: redis
      MONGO_TLS_CA_FILE: /run/tls/ca.pem
      MONGO_TLS_CERT_KEY_FILE: /run/tls/app.pem
      FORWARDED_ALLOW_IPS: 172.30.0.10
    volumes:
    - ./secrets/tls:/run/tls:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
    - private
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ''
    restart: unless-stopped
    networks:
    - private
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy-data:/data
    - caddy-config:/config
    depends_on:
    - frontend
    - backend
    networks:
      private:
        ipv4_address: 172.30.0.10
networks:
  private:
    ipam:
      config:
      - subnet: 172.30.0.0/24
volumes:
  mongo-prod: null
  caddy-data: null
  caddy-config: null
